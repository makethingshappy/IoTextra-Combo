kind: module
product: IoTextra Combo
revision: "3.04"
# Channel -> HOST line (AP0..AP7) and/or TCA9534 port bit
# active: level on the HOST line / expander bit that means "output on"
# expander parallel: P0, P1 are wired to the same nets as AP0, AP1 (I2C optional).
#   In I2C mode the MCU must leave AP0, AP1 as inputs (high-Z); TCA9534 powers up with all ports as inputs.
# Source: IoTextra Combo 3-04 schematic (folder v.3.03_and_v.3.04)
expander:
  chip: TCA9534
  address: "0x20-0x27 (TCA9534) / 0x38-0x3F (TCA9534A); A2..A0 set by SB5..SB3; default 0x27 / 0x3F"
  wiring: parallel        # P0 = RL1, P1 = RL2; P2..P7 not connected
  int: {host: AP4}        # shared with ADS1115 ALERT/RDY
adc:
  chip: ADS1115
  ref: U2
  address: "0x49 (SB2 open, default) / 0x48 (SB2 closed)"
  alert: AP4              # shared with TCA9534 INT
channels:
  RL1: {type: relay_spdt, ap: AP0, bit: P0, active: low}   # K1
  RL2: {type: relay_spdt, ap: AP1, bit: P1, active: low}   # K2
  AI1: {type: AI, adc: U2, mux: AIN0-AIN1}   # R jumpers SB7+SB10
  AI2: {type: AI, adc: U2, mux: AIN2-AIN3}   # R jumpers SB6+SB8
unused: [AP2, AP3, AP5, AP6, AP7]
# Analog scaling (same as IoTextra Analog): Vin = Vdiff * 105k / R ; Iin = Vin / 248.7 ohm
#   R = 24.95k (both jumpers of the pair closed, default) or 49.9k (both open)
